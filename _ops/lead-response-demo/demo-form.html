<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request a quote</title>
<style>
:root{--bg:#f6f7f5;--fg:#1b2220;--muted:#5d6864;--line:#d0d7d3;--panel:#fff;--accent:#1f6f5c}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--fg:#e6ebe8;--muted:#9aa6a1;--line:#2b3531;--panel:#19201d;--accent:#5cc3a6}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:32px 16px}
h1{font-size:1.6rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
form{background:var(--panel);border:1px solid var(--line);padding:20px;display:grid;gap:14px}
label{display:grid;gap:4px;font-size:.9rem;font-weight:600}
input,textarea{font:inherit;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.85rem;color:var(--muted)}
.consent input{margin-top:3px}
button{font:inherit;font-weight:600;padding:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#status{min-height:1.4em;font-size:.9rem}
</style></head><body><main>
<h1 id="biz-h">Request a quote</h1>
<p class="sub">Tell us what you need and we will be in touch right away.</p>
<form id="f">
  <label>Your name<input id="name" required autocomplete="name"></label>
  <label>Mobile number<input id="phone" type="tel" required autocomplete="tel" placeholder="(480) 555-0123"></label>
  <label>Email (optional)<input id="email" type="email" autocomplete="email"></label>
  <label>What do you need?<textarea id="message" rows="3" placeholder="Interested in a quote, please call or text me."></textarea></label>
  <label class="consent"><input id="consent" type="checkbox" required>
    <span>I agree to receive an automated text and a call from an AI assistant for <b class="biz">this business</b> at the number above about my request. Consent is not a condition of purchase. Message and data rates may apply. Reply STOP to opt out.</span></label>
  <button id="go" type="submit">Request a quote</button>
  <div id="status" role="status"></div>
</form></main>
<script>
// 1) Paste your n8n PRODUCTION webhook URL here (ends in /webhook/lead-demo).
var WEBHOOK_URL = "PASTE_N8N_PRODUCTION_WEBHOOK_URL";
// 2) Personalize per prospect: demo-form.html?biz=Honest%20Air
var biz = new URLSearchParams(location.search).get("biz") || "this business";
document.querySelectorAll(".biz").forEach(function(e){e.textContent=biz});
document.getElementById("biz-h").textContent = biz === "this business" ? "Request a quote" : biz + ": request a quote";
document.title = biz + " | Request a quote";
document.getElementById("f").addEventListener("submit", function(ev){
  ev.preventDefault();
  var st=document.getElementById("status"), go=document.getElementById("go");
  go.disabled=true; st.textContent="Sending...";
  fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    name:document.getElementById("name").value, phone:document.getElementById("phone").value,
    email:document.getElementById("email").value, message:document.getElementById("message").value,
    consent:document.getElementById("consent").checked, business_name:biz, source:"demo form"
  })}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(x){ st.textContent = x.ok ? "Thanks. You will get a text now and a call in a moment." : (x.j.reason||"Something went wrong."); go.disabled=false })
  .catch(function(){ st.textContent="Could not send. Check the webhook URL."; go.disabled=false });
});
</script></body></html>
